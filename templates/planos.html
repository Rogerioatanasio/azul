<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Planos • Projeto Azul</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f3f6fb;
        }

        .plan-card {
            border-radius: 18px;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .highlight {
            border: 2px solid #2563eb;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>

<body class="container py-5">

<h1 class="mb-4 text-center">Escolha seu plano</h1>

<div class="row g-4 justify-content-center">

    <!-- GRATIS -->
    <div class="col-md-4">
        <div class="card plan-card p-4 text-center">
            <h3>Grátis</h3>
            <p class="price">R$ 0</p>

            <ul class="list-unstyled mt-3">
                <li>✔ Perfil básico</li>
                <li>✔ Listagem normal</li>
            </ul>

            <button class="btn btn-secondary mt-3" disabled>Plano atual</button>
        </div>
    </div>

    <!-- DESTAQUE -->
    <div class="col-md-4">
        <div class="card plan-card highlight p-4 text-center">
            <h3>Destaque</h3>
            <p class="price">R$ 9,90</p>

            <ul class="list-unstyled mt-3">
                <li>✔ Fica no topo</li>
                <li>✔ Mais visibilidade</li>
                <li>✔ Mais contatos</li>
            </ul>

            <form method="POST" action="{{ url_for('destacar', id=t.id) }}">
                <button class="btn btn-primary mt-3 w-100">
                    Escolher plano
                </button>
            </form>
        </div>
    </div>

</div>

<div class="text-center mt-4">
    <a href="{{ url_for('contratar') }}">← Voltar</a>
</div>

</body>
</html>
