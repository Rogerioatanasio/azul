<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Azul</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #486acf, #4069ca);
        }

        .hero-wrapper {
            min-height: calc(100vh - 76px);
        }

        .hero-card {
            max-width: 460px;
            width: 100%;
            border: none;
            border-radius: 20px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
        }

        .hero-title {
            color: #325dc9;
            font-weight: 700;
        }

        .hero-subtitle {
            color: #6b7280;
        }

        .btn-azul {
            background-color: #355dc2;
            color: #fff;
            border: none;
            font-weight: 600;
            padding: 12px 16px;
            border-radius: 12px;
            transition: 0.2s ease;
        }

        .btn-azul:hover {
            background-color: #ff8c00;
            color: #fff;
            transform: translateY(-1px);
        }

        .navbar-brand {
            font-weight: 700;
            color: #325dc9 !important;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">Projeto Azul</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAzul" aria-controls="menuAzul" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuAzul">
                <div class="ms-auto d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0">
                    {% if session.get("user_id") %}
                        <a class="btn btn-outline-primary" href="{{ url_for('trabalhar') }}">Meu perfil profissional</a>
                        <a class="btn btn-outline-danger" href="{{ url_for('logout') }}">Sair</a>
                    {% else %}
                        <a class="btn btn-outline-primary" href="{{ url_for('login') }}">Entrar</a>
                        <a class="btn btn-primary" href="{{ url_for('register') }}">Criar conta</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="container d-flex justify-content-center align-items-center hero-wrapper">
        <div class="card hero-card">
            <div class="card-body text-center p-4 p-md-5">
                <h1 class="hero-title mb-3">Projeto Azul</h1>

                <p class="hero-subtitle mb-4">
                    Conectando profissionais da obra com quem precisa.
                </p>

                <div class="d-grid gap-3">
                    <a class="btn btn-azul btn-lg" href="{{ url_for('trabalhar') }}">
                        Quero Trabalhar
                    </a>
                    <a class="btn btn-azul btn-lg" href="{{ url_for('contratar') }}">
                        Quero Contratar
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
